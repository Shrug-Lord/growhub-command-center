name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/server/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix deploy/server
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run security
      - run: npm run security:signatures

  host-compatibility:
    name: Host compatibility (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS ARM64
          - os: windows-latest
            label: Windows x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/server/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix deploy/server
      - run: npm test
      - run: npm run build

  browser:
    name: Browser and accessibility
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/server/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix deploy/server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Compose production smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: docker compose -f deploy/compose.yml config
      - run: docker compose -f deploy/compose.yml build server
      - name: Start and verify stack
        run: |
          docker compose -f deploy/compose.yml up -d
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose.yml ps
          docker compose -f deploy/compose.yml logs --tail=200
          exit 1
      - run: npm run test:compose:mqtt
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/compose.yml down -v --remove-orphans

  release-image:
    name: Release image (AMD64 + ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build multi-architecture production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
