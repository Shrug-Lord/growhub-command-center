name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/server/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix deploy/server
      - name: Validate tag and release evidence
        run: npm run release:validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run verify
      - run: npm run security:signatures
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Create source archive and checksums
        run: |
          mkdir -p release
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar --prefix="growhub-command-center-${version}/" HEAD | gzip -9 > "release/growhub-command-center-${version}.tar.gz"
          cd release
          sha256sum ./*.tar.gz > SHA256SUMS

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Normalize container image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}

      - name: Attest container image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest source archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release/*.tar.gz

      - name: Upload release build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: growhub-command-center-${{ github.ref_name }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "Compatible CE firmware: 1.1.0C." \
            "" \
            "CE hardware evidence: docs/release-evidence/CE-1.1.0C.md" \
            "Host evidence: docs/release-evidence/HOST-COMPATIBILITY.md" \
            "Accessibility evidence: docs/release-evidence/ACCESSIBILITY-v0.1.0.md" \
            "Container image: ${IMAGE_NAME}:${GITHUB_REF_NAME#v}" \
            "Verify the attached source archive with SHA256SUMS or GitHub artifact attestations." \
            > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            release/*.tar.gz \
            release/SHA256SUMS \
            --verify-tag \
            --title "Growhub Command Center $GITHUB_REF_NAME" \
            --notes-file release-notes.md
