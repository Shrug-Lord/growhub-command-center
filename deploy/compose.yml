services:

  mosquitto:
    image: eclipse-mosquitto:2.0@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
    restart: unless-stopped
    ports:
      - "${GROWHUB_MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - growhub
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      - mosquitto
    ports:
      - "${GROWHUB_HTTP_PORT:-80}:3000"
    environment:
      NODE_ENV:       production
      MQTT_URL:       ${MQTT_URL:-mqtt://mosquitto:1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-growhub-command-center}
      APP_DATA_DIR:   /data
      DB_PATH:        /data/growhub.db
      PORT:           "3000"
      DIST_DIR:       /app/dist
      LOG_LEVEL:      ${LOG_LEVEL:-info}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/ready')
          .then((response) => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - server_data:/data
    networks:
      - growhub
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  operations:
    image: node:24-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd
    profiles:
      - operations
    network_mode: none
    command:
      - "true"
    volumes:
      - server_data:/volumes/server
      - mosquitto_data:/volumes/mosquitto

volumes:
  mosquitto_data:
  server_data:

networks:
  growhub:
    driver: bridge
